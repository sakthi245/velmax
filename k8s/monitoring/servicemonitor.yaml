apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hybrid-scraper-api
  namespace: hybrid-scraper
  labels:
    app.kubernetes.io/name: hybrid-scraper
    app.kubernetes.io/component: api
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hybrid-scraper
      app.kubernetes.io/component: api
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - hybrid-scraper
---
