apiVersion: v1
kind: Secret
metadata:
  name: hybrid-scraper-secrets
  namespace: hybrid-scraper
  labels:
    app.kubernetes.io/name: hybrid-scraper
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # API Keys - REPLACE WITH ACTUAL VALUES
  GROQ_API_KEY: "your-groq-api-key-here"
  SERPAPI_API_KEY: "your-serpapi-api-key-here"
  TINYFISH_API_KEY: "your-tinyfish-api-key-here"
  FIRECRAWL_API_KEY: "local-dev"
  OPENAI_API_KEY: "your-openai-api-key-here"
  
  # Database
  POSTGRES_PASSWORD: "changeme-in-production"
  REDIS_PASSWORD: "changeme-in-production"
  RABBITMQ_PASSWORD: "changeme-in-production"
  
  # Optional: Proxy
  PROXY_USERNAME: ""
  PROXY_PASSWORD: ""
  PROXY_SERVER: ""